name: Apply research manuscript update

on:
  push:
    branches: [main]
    paths:
      - 'repo_update_payload.ready'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect extracted JMLR title block
        run: |
          cat repo_update_payload.part-* | base64 --decode > /tmp/core_tfm_update.tar.gz
          echo '2a120deff68371e7f734be3a95406fd3434f4363b5ddfae3e3c013e2dbb7cbf5  /tmp/core_tfm_update.tar.gz' | sha256sum -c -
          tar -xzf /tmp/core_tfm_update.tar.gz -C .
          echo '--- paper/jmlr/main.tex lines 1-70 ---'
          nl -ba paper/jmlr/main.tex | sed -n '1,70p'
          echo '--- end title block diagnostic ---'
          exit 1
