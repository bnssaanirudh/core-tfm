name: TabICLv2 Wine sanity

on:
  push:
    branches: [main]
    paths:
      - 'experiments/tabicl_wine_sanity.py'
      - '.github/workflows/tabicl-wine-sanity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install package and real-model dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install tabicl==2.1.1

      - name: Run one-fold Wine sanity experiment
        env:
          PYTHONPATH: src
        run: python experiments/tabicl_wine_sanity.py

      - name: Commit sanity result when successful
        run: |
          git config user.name "Badampudi Agasthya Anirudh"
          git config user.email "anirudhbadampudi@gmail.com"
          git add -f results/real_sanity_wine_tabiclv2.json
          if git diff --cached --quiet; then
            echo "No result change"
          else
            git commit -m "Record TabICLv2 Wine sanity result"
            git push
          fi
