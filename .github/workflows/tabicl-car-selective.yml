name: TabICLv2 Car Selective CoRe benchmark

on:
  push:
    branches: [main]
    paths:
      - 'experiments/tabicl_car_selective_fivefold.py'
      - 'src/core_tfm/reconciliation/selective.py'
      - '.github/workflows/tabicl-car-selective.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install package and real-model dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install tabicl==2.1.1 ucimlrepo

      - name: Run leakage-free five-fold selective benchmark
        env:
          PYTHONPATH: src
        run: python experiments/tabicl_car_selective_fivefold.py

      - name: Commit benchmark result when successful
        run: |
          git config user.name "Badampudi Agasthya Anirudh"
          git config user.email "anirudhbadampudi@gmail.com"
          git add -f results/real_car_tabiclv2_selective_fivefold.json
          if git diff --cached --quiet; then
            echo "No result change"
          else
            git commit -m "Record five-fold Selective CoRe Car benchmark"
            git push
          fi
