name: Apply selective-pilot manuscript update

on:
  push:
    branches: [main]
    paths:
      - 'scripts/update_jmlr_selective_pilot.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply deterministic manuscript patch
        run: python scripts/update_jmlr_selective_pilot.py

      - name: Run research tests
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'
          PYTHONPATH=src pytest -q

      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-extra texlive-fonts-recommended poppler-utils

      - name: Compile official JMLR draft
        working-directory: paper/jmlr
        run: |
          curl -fsSLo jmlr2e.sty https://raw.githubusercontent.com/JmlrOrg/jmlr-style-file/master/jmlr2e.sty
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          cp main.pdf CoRe_TFM_JMLR_Draft.pdf
          pdfinfo CoRe_TFM_JMLR_Draft.pdf
          rm -f jmlr2e.sty main.aux main.bbl main.blg main.fdb_latexmk main.fls main.log main.out main.pdf

      - name: Commit validated manuscript update
        run: |
          rm -f scripts/update_jmlr_selective_pilot.py
          git config user.name 'Badampudi Agasthya Anirudh'
          git config user.email 'anirudhbadampudi@gmail.com'
          git add -A
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'Refusing to push workflow mutations from Actions token.'
            exit 1
          fi
          git commit -m 'Add leakage-free Selective CoRe pilot result to manuscript'
          git push
