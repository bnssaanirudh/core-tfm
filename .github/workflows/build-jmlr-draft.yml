name: Build JMLR draft

on:
  push:
    branches: [main]
    paths:
      - 'paper/jmlr/**'
      - 'paper/generate_benchmark_figures.py'
      - 'results/q1_fast_complete_256_v1/**'
      - 'experiments/analyze_q1_benchmark.py'
      - 'src/core_tfm/benchmark_audit.py'
      - '.github/workflows/build-jmlr-draft.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-extra texlive-fonts-recommended poppler-utils

      - name: Fetch official JMLR style
        working-directory: paper/jmlr
        run: |
          curl -fsSLo jmlr2e.sty https://raw.githubusercontent.com/JmlrOrg/jmlr-style-file/master/jmlr2e.sty

      - name: Install analysis dependencies
        run: python -m pip install -e '.[test]'

      - name: Validate benchmark and regenerate figures
        run: |
          python experiments/analyze_q1_benchmark.py > benchmark-audit.json
          python paper/generate_benchmark_figures.py

      - name: Compile with official style
        working-directory: paper/jmlr
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex

      - name: Validate compiled PDF
        working-directory: paper/jmlr
        run: |
          test -s main.pdf
          pdfinfo main.pdf | tee pdfinfo.txt
          test "$(stat -c%s main.pdf)" -lt 5000000
          test "$(pdfinfo main.pdf | awk '/^Pages:/ {print $2}')" -gt 0

      - name: Verify committed draft exists
        working-directory: paper/jmlr
        run: |
          test -s CoRe_TFM_JMLR_Draft.pdf
          echo "Official-style compilation and committed draft checks passed."
