name: TabICLv2 Car five-fold benchmark

on:
  push:
    branches: [main]
    paths:
      - 'experiments/tabicl_car_fivefold.py'
      - 'src/core_tfm/**'
      - '.github/workflows/tabicl-car-sanity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install package and real-model dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install tabicl ucimlrepo

      - name: Run five-fold real-model benchmark
        env:
          PYTHONPATH: src
        run: python experiments/tabicl_car_fivefold.py

      - name: Commit benchmark result when successful
        run: |
          git config user.name "bnssaanirudh"
          git config user.email "anirudhbadampudi@gmail.com"
          git add -f results/real_car_tabiclv2_fivefold.json
          if git diff --cached --quiet; then
            echo "No result change"
          else
            git commit -m "Record five-fold TabICLv2 Car benchmark"
            git push
          fi
