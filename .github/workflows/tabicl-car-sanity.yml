name: TabICLv2 Car sanity

on:
  push:
    branches: [main]
    paths:
      - 'experiments/tabicl_car_sanity.py'
      - 'src/core_tfm/**'
      - '.github/workflows/tabicl-car-sanity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install package and real-model dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install tabicl ucimlrepo

      - name: Run one-fold real-model sanity experiment
        env:
          PYTHONPATH: src
        run: python experiments/tabicl_car_sanity.py

      - name: Commit sanity result when successful
        run: |
          git config user.name "bnssaanirudh"
          git config user.email "anirudhbadampudi@gmail.com"
          git add results/real_sanity_car_tabiclv2.json
          if git diff --cached --quiet; then
            echo "No result change"
          else
            git commit -m "Record TabICLv2 Car sanity result"
            git push
          fi
