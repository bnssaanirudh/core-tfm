# Research defaults. Heavy model packages/checkpoints are optional.
tabpfn3:
  constructor: tabpfn.TabPFNClassifier

tabiclv2:
  constructor: tabicl.TabICLClassifier
  # Uniform final-matrix setting: cache is incompatible with unseen test
  # categories on Diamonds and can otherwise change the feasible cell set.
  kv_cache: false
  n_estimators: 4
  random_state: 42

tabfm:
  constructor: tabfm.TabFMClassifier
  backend: pytorch
